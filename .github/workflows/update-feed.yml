name: Update Master Database EU Jobs RSS Feed

on:
  schedule:
    - cron: "0 6,12,18 * * *" # Runs daily at 07:00, 13:00, and 19:00 CET
  workflow_dispatch:          # Manual trigger anytime

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build filtered RSS feed
        run: python build_feed.py

      - name: Commit updated feed.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "Update Master Database jobs RSS feed"
          git push
